# 将此配置文件的副本放置到 ~/.aerospace.toml
# 之后，你可以按照自己的喜好编辑 ~/.aerospace.toml
# ============================================================
#  本文件的改动记录（2026-10-22 整理）
# ------------------------------------------------------------
#  【改动 1】persistent-workspaces  —— 常驻工作区，防止销毁重建
#  【改动 2】workspace-to-monitor-force-assignment —— 工作区固定绑定屏幕
#  【改动 3】工作区切换键位重排
#  【改动 4】alt-q/w/e/a/s/d 一键双屏（命令数组）
#  【改动 5】alt-shift-* 送窗口到其他工作区
#  【改动 6】修正了两个写错的配置键名（见下方 normalization 段）
#  【改动 7】config-version 从 1 升到 2
# ------------------------------------------------------------
#  双屏布局约定：
#    左屏（从左数第 1 块，当前 MSI PAG252PF） -> 数字工作区 1-9
#    右屏（从左数第 2 块，当前 HDMI）        -> 字母工作区 A/S/D/E/Q/W/U/I/O
# ============================================================

# 配置文件版本，用于兼容性和废弃功能处理
# 默认值（如果省略此键）：config-version = 1
#
# 【改动 7】原来这里是 1。改为 2 之后 persistent-workspaces 才会真正生效
#          （v1 下该键会被静默忽略）；reload-config 也不再报 outdated 警告。
config-version = 2

# 可用于添加在 AeroSpace 启动后运行的命令
# 可用命令：https://nikitabobko.github.io/AeroSpace/commands
# 注意：这里不要放 workspace 切换 / move-node 之类的命令，
#       否则登录、唤醒时会重新分配窗口，布局会被打乱
after-startup-command = []

# 登录时自动启动 AeroSpace
start-at-login = true

# 【改动 6】修正写错的键名
# 规范化设置。参见：https://nikitabobko.github.io/AeroSpace/guide#normalization
#
# 原来这两行的键名结尾写成了 ...flatten-containers / ...nested-containers，
# 不是 AeroSpace 认识的有效键名，会被【静默忽略】，
# 所以"规范化"功能其实一直没生效。现已改成正确的键名。
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# 参见：https://nikitabobko.github.io/AeroSpace/guide#layouts
# 'accordion-padding' 指定手风琴布局的内边距大小
# 可设为 0 以禁用该内边距功能
accordion-padding = 30

# 可选值：tiles（平铺）| accordion（手风琴）
default-root-container-layout = 'tiles'

# 可选值：horizontal（水平）| vertical（垂直）| auto（自动）
# 'auto' 表示：宽屏显示器（宽度大于高度）使用水平方向，
#              竖屏显示器（高度大于宽度）使用垂直方向
default-root-container-orientation = 'auto'

# 当焦点切换到其他显示器时，鼠标跟随焦点移动
# 如果不喜欢此行为，可从配置中删除此项
# 参见：https://nikitabobko.github.io/AeroSpace/guide#on-focus-changed-callbacks
# 参见：https://nikitabobko.github.io/AeroSpace/commands#move-mouse
# 默认值（如果省略此键）：on-focused-monitor-changed = []
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# 可通过此开关有效禁用 macOS 的"隐藏应用"功能（cmd-h）
# 如果你不使用该 macOS 功能，但经常误触 cmd-h 或 cmd-alt-h，可启用此项
# 另见：https://nikitabobko.github.io/AeroSpace/goodies#disable-hide-app
automatically-unhide-macos-hidden-apps = true

# ============================================================
#  【改动 1】常驻工作区 persistent-workspaces
# ============================================================
# 作用：工作区即使空着、或没显示在任何屏幕上，也不会被销毁重建。
#       AeroSpace 默认是"按需创建、空了就销毁"，工作区一旦被销毁重建，
#       窗口容器树和布局结构就丢了，回来时窗口会被重新平铺 -> 全挤在一起。
#
# 前提：该配置项只在 config-version = 2 及以上可用。
#       （config-version = 1 时这一整行会被静默忽略，等于没写）
#
# 当前只保留常用的 12 个：
#   数字 1-6  -> 左屏（MSI）
#   字母 Q/W/E/D/S/A -> 右屏（HDMI）
# 其余工作区（7/8/9、U/I/O）不常驻，切过去时会临时创建，空了自动回收。
#
# 注意：工作区名【区分大小写】，必须写大写的 'Q' 而不是 'q'。
persistent-workspaces = ['1','2','3','4','5','6','Q','W','E','D','S','A']

# ============================================================
#  【改动 2】工作区固定绑定显示器
# ============================================================
# 作用：工作区永远出现在指定屏幕上。显示器断开再连上时，工作区会自动
#       回到它绑定的那块屏，而不是被挤到剩下的屏幕上。
#       这是"关显示器后布局不乱"的第二个关键。
#
# 【代价】被绑定的工作区，move-workspace-to-monitor / summon-workspace 命令会失效
#         （AeroSpace 官方设计如此），也就是 cmd-alt-ctrl-+/- 对它们不起作用。
#         要临时搬动，就注释掉对应那一行，再 reload-config。
# 匹配规则：
#   'main'      = 系统设置 → 显示器 里设为"主显示器"的那块
#   'secondary' = 只有两块屏时的非主屏
#   1 / 2       = 从左到右第几块屏（1 开始）
#   'regex'     = 显示器名字的不区分大小写正则，如 'built-in.*'、'MSI'
#   数组        = 按顺序取第一个匹配到的
# 用 `aerospace list-monitors` 可查看当前显示器名字与顺序
[workspace-to-monitor-force-assignment]
# 数字工作区 1-9 -> 从左到右第 1 块屏（左屏，当前是 MSI PAG252PF）
1 = 1
2 = 1
3 = 1
4 = 1
5 = 1
6 = 1
7 = 1
8 = 1
9 = 1

# 字母工作区 -> 从左到右第 2 块屏（右屏，当前是 HDMI）
A = 2
S = 2
D = 2
E = 2
Q = 2
W = 2
U = 2
I = 2
O = 2

# 说明：这里用 1/2 这种"从左到右第几块屏"的写法，而不是写死显示器名字，
#       好处是换线、改分辨率都不受影响；坏处是调整显示器左右顺序后编号会变。

# 每次绑定模式切换时触发的回调
# 参见：https://nikitabobko.github.io/AeroSpace/guide#binding-modes
# 参见：https://nikitabobko.github.io/AeroSpace/commands#mode
on-mode-changed = []

# 可选值：(qwerty | dvorak | colemak)
# 参见：https://nikitabobko.github.io/AeroSpace/guide#key-mapping
[key-mapping]
    preset = 'qwerty'

# 窗口之间的间距（inner-*）以及窗口与显示器边缘之间的间距（outer-*）
# 可选值：
# - 固定值：      gaps.outer.top = 8
# - 按显示器设置：gaps.outer.top = [{ monitor.main = 16 }, { monitor."some-pattern" = 32 }, 24]
#                 其中 24 是没有匹配时的默认值
#                 显示器匹配规则与 'workspace-to-monitor-force-assignment' 相同
#                 参见：https://nikitabobko.github.io/AeroSpace/guide#assign-workspaces-to-monitors
[gaps]
    inner.horizontal = 3
    inner.vertical =   3
    outer.left =       4
    outer.bottom =     4
    outer.top =        4
    outer.right =      4

# 'main' 绑定模式声明
# 参见：https://nikitabobko.github.io/AeroSpace/guide#binding-modes
# 'main' 绑定模式必须始终存在
# 默认值（如果省略此键）：mode.main.binding = {}
[mode.main.binding]

    # 所有可用按键：
    # - 字母键：      a, b, c, ..., z
    # - 数字键：      0, 1, 2, ..., 9
    # - 小键盘数字：  keypad0, keypad1, keypad2, ..., keypad9
    # - 功能键：      f1, f2, ..., f20
    # - 特殊按键：    minus, equal, period, comma, slash, backslash, quote, semicolon,
    #                 backtick, leftSquareBracket, rightSquareBracket, space, enter, esc,
    #                 backspace, tab, pageUp, pageDown, home, end, forwardDelete,
    #                 sectionSign（仅限 ISO 键盘 / 欧洲键盘）
    # - 小键盘特殊键：keypadClear, keypadDecimalMark, keypadDivide, keypadEnter, keypadEqual,
    #                 keypadMinus, keypadMultiply, keypadPlus
    # - 方向键：      left, down, up, right

    # 所有可用修饰键：cmd, alt, ctrl, shift

    # 所有可用命令：https://nikitabobko.github.io/AeroSpace/commands

    # 参见：https://nikitabobko.github.io/AeroSpace/commands#exec-and-forget
    # 可取消注释以下代码，通过 alt + enter 快捷键打开终端（类似 i3 的用法）
    # alt-enter = '''exec-and-forget osascript -e '
    # tell application "Terminal"
    #     do script
    #     activate
    # end tell'
    # '''

    # 分屏模式切换，现在用的是句号和他旁边斜杠
    alt-slash = 'layout tiles horizontal vertical'
    alt-period = 'layout accordion horizontal vertical'

    # 聚焦
    alt-h = 'focus left'
    alt-j = 'focus down'
    alt-k = 'focus up'
    alt-l = 'focus right'
    alt-left = 'focus left'
    alt-down = 'focus down'
    alt-up = 'focus up'
    alt-right = 'focus right'

    # 移动窗口
    alt-shift-h = 'move left'
    alt-shift-j = 'move down'
    alt-shift-k = 'move up'
    alt-shift-l = 'move right'
    alt-shift-left = 'move left'
    alt-shift-down = 'move down'
    alt-shift-up = 'move up'
    alt-shift-right = 'move right'

    # 尺寸大小
    alt-minus = 'resize width -50'
    alt-equal = 'resize width +50'
    # 尺寸大小
    alt-shift-minus = 'resize height -50'
    alt-shift-equal = 'resize height +50'

    #平衡窗口
    alt-0 = 'balance-sizes'
    #重置分屏
    alt-shift-0 = 'flatten-workspace-tree'
    
    #工作区移动至显示器
    cmd-alt-ctrl-minus= 'move-workspace-to-monitor prev'
    cmd-alt-ctrl-equal= 'move-workspace-to-monitor next'

    #当前焦点改为浮动窗口
    alt-f = 'layout floating tiling'
    #macOS原生最小化
    alt-c = 'macos-native-minimize'

    # 参见：https://nikitabobko.github.io/AeroSpace/commands#workspace-back-and-forth
    alt-tab = 'workspace-back-and-forth'
    # 参见：https://nikitabobko.github.io/AeroSpace/commands#move-workspace-to-monitor
    alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

    # 参见：https://nikitabobko.github.io/AeroSpace/commands#mode

    # ============================================================
    #  【改动 3】工作区切换键位
    # ============================================================
    # 布局约定：数字工作区都在左屏(1)，字母工作区都在右屏(2)
    #
    # 切换数字工作区：alt + 数字
    # 切换字母工作区：ctrl + alt + 字母（因为 alt+shift+字母 要留给"送窗口"）
    # 临时工作区 U/I/O：直接 alt + 字母，不加 ctrl
    # 一键双屏：alt + q/w/e/a/s/d，一次切两块屏（左屏数字 + 右屏字母）
    #
    # 注意：alt-q/w/e/a/s/d 是数组绑定，会和"切换字母工作区"里的
    #      ctrl-alt-q/w/e/a/s/d 并存，两者用途不同，别搞混：
    #        ctrl-alt-q = 只切右屏到 Q
    #        alt-q      = 左屏切到 1，同时右屏切到 Q

    alt-1 = 'workspace 1'
    alt-2 = 'workspace 2'
    alt-3 = 'workspace 3'
    alt-4 = 'workspace 4'
    alt-5 = 'workspace 5'
    alt-6 = 'workspace 6'
    alt-7 = 'workspace 7'
    alt-8 = 'workspace 8'
    alt-9 = 'workspace 9'

    # 字母工作区：ctrl + alt + 字母
    ctrl-alt-a = 'workspace A'
    ctrl-alt-s = 'workspace S'
    ctrl-alt-d = 'workspace D'
    ctrl-alt-e = 'workspace E'
    ctrl-alt-q = 'workspace Q'
    ctrl-alt-w = 'workspace W'

    # 临时工作区 U / I / O：不加 ctrl，直接 alt + 字母，方便随手切过去放东西
    alt-u = 'workspace U'
    alt-i = 'workspace I'
    alt-o = 'workspace O'

    # 【改动 4】一键双屏：一个键 = 左屏一个数字 + 右屏一个字母
    # 原理：AeroSpace 的命令数组会按顺序执行。因为 1-6 被 force-assign 到左屏、
    #      Q/W/E/A/S/D 被 force-assign 到右屏，所以两条 workspace 命令各管各的屏，
    #      不会互相覆盖（这一点已实测验证）。
    alt-q = ['workspace 1', 'workspace Q']
    alt-w = ['workspace 2', 'workspace W']
    alt-e = ['workspace 3', 'workspace E']
    alt-a = ['workspace 4', 'workspace A']
    alt-s = ['workspace 5', 'workspace S']
    alt-d = ['workspace 6', 'workspace D']

    # ============================================================
    #  【改动 5】把当前窗口送到其他工作区
    # ============================================================
    # 用 alt + shift + 工作区名。这个键位是原本的习惯，保留不变。
    # 数字：alt + shift + 数字
    alt-shift-1 = 'move-node-to-workspace 1'
    alt-shift-2 = 'move-node-to-workspace 2'
    alt-shift-3 = 'move-node-to-workspace 3'
    alt-shift-4 = 'move-node-to-workspace 4'
    alt-shift-5 = 'move-node-to-workspace 5'
    alt-shift-6 = 'move-node-to-workspace 6'
    alt-shift-7 = 'move-node-to-workspace 7'
    alt-shift-8 = 'move-node-to-workspace 8'
    alt-shift-9 = 'move-node-to-workspace 9'
    # 字母：alt + shift + 字母
    alt-shift-a = 'move-node-to-workspace A'
    alt-shift-s = 'move-node-to-workspace S'
    alt-shift-d = 'move-node-to-workspace D'
    alt-shift-e = 'move-node-to-workspace E'
    alt-shift-q = 'move-node-to-workspace Q'
    alt-shift-w = 'move-node-to-workspace W'
    alt-shift-u = 'move-node-to-workspace U'
    alt-shift-i = 'move-node-to-workspace I'
    alt-shift-o = 'move-node-to-workspace O'

    # 参见：https://nikitabobko.github.io/AeroSpace/commands#mode
    alt-shift-semicolon = 'mode service'

# 'service' 绑定模式声明
# 参见：https://nikitabobko.github.io/AeroSpace/guide#binding-modes
[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main'] # 重置布局
    f = ['layout floating tiling', 'mode main'] # 切换浮动与平铺布局
    backspace = ['close-all-windows-but-current', 'mode main']

    # sticky（置顶）功能尚未支持：https://github.com/nikitabobko/AeroSpace/issues/2
    #s = ['layout sticky tiling', 'mode main']

    alt-shift-h = ['join-with left', 'mode main']
    alt-shift-j = ['join-with down', 'mode main']
    alt-shift-k = ['join-with up', 'mode main']
    alt-shift-l = ['join-with right', 'mode main']

